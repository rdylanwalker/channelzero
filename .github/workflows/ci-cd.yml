name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  rust:
    name: Rust Format, Clippy & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test

  frontend:
    name: Frontend Format, Lint, Typecheck & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check Prettier formatting
        run: frontend/node_modules/.bin/prettier --check .
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  e2e:
    name: Playwright E2E (Chromium)
    needs: [rust, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build backend release binary
        run: cargo build --release
      - name: Install Playwright & Chromium
        working-directory: playwright
        run: npm ci && npm run typecheck && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: playwright
        run: npm run test:e2e
      - name: Update README dashboard screenshot on PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: playwright
        run: npm run screenshot
      - name: Commit updated screenshot if changed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet docs/dashboard.png; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/dashboard.png
            git commit -m "docs(readme): update dashboard screenshot [skip ci]"
            git push
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 7

  release:
    name: Semantic Release
    needs: [rust, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release
      - name: Detect published release tag
        id: tag
        run: |
          git fetch --tags --force
          TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -n1 || true)"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & Publish OCI Image (GHCR)
    needs: [release]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.release_tag != '') ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release tag
        id: meta_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ needs.release.outputs.release_tag }}"
          fi
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE_LOWER="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push OCI image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta_tag.outputs.image }}:${{ steps.meta_tag.outputs.version }}
            ${{ steps.meta_tag.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Link container image in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta_tag.outputs.tag }}"
          VERSION="${{ steps.meta_tag.outputs.version }}"
          IMAGE="${{ steps.meta_tag.outputs.image }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          EXISTING_NOTES="$(gh release view "$TAG" --json body -q .body || true)"
          SECTION=$(printf '\n\n### Container Image\n- `%s:%s`\n- `%s:latest`\n- Digest: `%s`\n\n```bash\ndocker pull %s:%s\n```' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" "$IMAGE" "$VERSION")
          gh release edit "$TAG" --notes "${EXISTING_NOTES}${SECTION}"
