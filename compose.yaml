services:
  channelzero:
    image: channelzero:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: channelzero
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:${PORT:-8080}'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-8080}
      - TZ=${TZ:-America/New_York}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - REGION=${REGION:-US}
      - NEW_RELEASE_DAYS=${NEW_RELEASE_DAYS:-30}
      - REFRESH_INTERVAL_HOURS=${REFRESH_INTERVAL_HOURS:-6}
      - PROVIDERS=${PROVIDERS:-netflix,max,disney_plus,prime_video,hulu,apple_tv_plus,peacock,paramount_plus}
      - TVMAZE_ENABLED=${TVMAZE_ENABLED:-true}
    volumes:
      - channelzero_data:/data
      # Optional: mount custom configuration file or directory
      # - ./config.json:/config/config.json:ro

volumes:
  channelzero_data:
    name: channelzero_data
