services:
  channelzero:
    image: channelzero:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: channelzero
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
      - REGION=US
      - NEW_RELEASE_DAYS=30
      - REFRESH_INTERVAL_HOURS=6
      # Providers in priority order (comma-separated):
      - PROVIDERS=netflix,max,disney_plus,prime_video,hulu,apple_tv_plus,peacock,paramount_plus
      # 1. Anonymous, free metadata (no key required):
      - TVMAZE_ENABLED=true
      # 2. Free-tier metadata (uncomment and add your key for movies & regional availability):
      # - TMDB_ENABLED=true
      # - TMDB_API_KEY=your_tmdb_api_key_here
      # 3. Optional ratings enrichment:
      # - OMDB_ENABLED=true
      # - OMDB_API_KEY=your_omdb_api_key_here
      # 4. Optional direct deep-link enrichment:
      # - WATCHMODE_ENABLED=true
      # - WATCHMODE_API_KEY=your_watchmode_api_key_here
    volumes:
      - channelzero_data:/data
      # Optional: mount custom configuration file or directory
      # - ./config.json:/config/config.json:ro

volumes:
  channelzero_data:
    name: channelzero_data
